swagger: '2.0'
info:
  title: Bank Argent API documentation
  description: Contains all available API endpoints in this codebase
  version: '1.0.0'
  termsOfService: 'http://swagger.io/terms/'
host: localhost:3001
basePath: /api/v1
schemes:
  - http
paths:
  /user/login:
    post:
      tags:
        - User Module
      summary: Login
      description: API for Login
      parameters:
        - in: body
          name: body
          description: Login Payload
          required: true
          schema:
            $ref: '#/definitions/Login'
      produces:
        - application/json
      responses:
        '200':
          description: Login Successfully
          schema:
            $ref: '#/definitions/LoginResponse'
        '400':
          description: Invalid Fields
        '500':
          description: Internal Server Error
  /user/signup:
    post:
      tags:
        - User Module
      summary: Signup
      description: API for Signup
      parameters:
        - in: body
          name: body
          description: Signup Payload
          required: true
          schema:
            $ref: '#/definitions/User'
      produces:
        - application/json
      responses:
        '200':
          description: Signup Successfully
          schema:
            $ref: '#/definitions/ApiResponse'
        '400':
          description: Invalid Fields
        '500':
          description: Internal Server Error
  /user/profile:
    post:
      security:
        - Bearer: []
      tags:
        - User Module
      summary: User Profile API
      description: API for fetching a user profile
      parameters:
        - in: header
          type: string
          name: Authorization
          description: Attach Bearer JWT token
          required: true
      produces:
        - application/json
      responses:
        '200':
          description: User profile retrieved successully
          schema:
            $ref: '#/definitions/ApiResponse'
        '400':
          description: Invalid Fields
        '500':
          description: Internal Server Error
    put:
      security:
        - Bearer: []
      tags:
        - User Module
      summary: User Profile API
      description: API for updating a user profile
      parameters:
        - in: header
          type: string
          name: Authorization
          description: Attach Bearer JWT token
          required: true
        - in: body
          name: body
          description: Update user profile attributes
          required: true
          schema:
            $ref: '#/definitions/UserProfile'
      produces:
        - application/json
      responses:
        '200':
          description: User profile retrieved successully
          schema:
            $ref: '#/definitions/ApiResponse'
        '400':
          description: Invalid Fields
        '500':
          description: Internal Server Error
  /transactions:
    get:
      security:
        - Bearer: []
      tags:
        - Transactions
      summary: Get user transactions
      description: Retrieve all transactions for the authenticated user, optionally filtered the account.
      parameters:
        - in: query
          name: accountId
          description: Bank account identifier
          type: string
          required: false
      produces:
        - application/json
      responses:
        '200':
          description: User transactions retrieved successully
          schema:
            $ref: '#/definitions/TransactionsResponse'
        '401':
          description: Not authenticated
        '500':
          description: Internal Server Error  
  /transactions/{transactionId}:
    get:
      security:
        - Bearer: []
      tags:
        - Transactions
      summary: Get transaction's informations
      description: Retrieve detailed information for a specific transaction of the authenticated user
      parameters:
        - name: transactionId
          in: path
          description: Unique identifier of the transaction
          type: string
          required: true
      produces:
        - application/json
      responses:
        '200':
          description: Transaction's informations retrieved successully
          schema:
            $ref: '#/definitions/Transaction'
        '401':
          description: Not authenticated
        '404':
          description: Transaction not found
        '500':
          description: Internal Server Error  

    put:
      security:
        - Bearer: []
      tags:
        - Transactions
      summary: Update transaction information
      description: Update the category or note of a specific transaction for the authenticated user
      parameters:
        - name: transactionId
          in: path
          description: Unique identifier of the transaction
          type: string
          required: true

        - in: body
          name: body
          description: Transaction's information to update
          required: true
          schema:
            $ref: '#/definitions/TransactionUpdate'
          
      produces:
        - application/json
      responses:
        '200':
          description: Transaction updated successully
          schema:
            $ref: '#/definitions/Transaction'
        '400':
          description: Invalid request
        '401':
          description: Not authenticated
        '404':
          description: Transaction not found
        '500':
          description: Internal Server Error  
securityDefinitions:
  Bearer:
    type: apiKey
    name: Authorization
    in: header
definitions:
  User:
    properties:
      email:
        type: string
        description: user email
      password:
        type: string
        description: user password
      firstName:
        type: string
        description: user first name
      lastName:
        type: string
        description: user last name
  Login:
    properties:
      email:
        type: string
        description: user email
      password:
        type: string
        description: user password
  ApiResponse:
    type: object
    properties:
      status:
        type: integer
      message:
        type: string
      body:
        type: object
        properties:
          id:
            type: string
          email:
            type: string
  LoginResponse:
    type: object
    properties:
      token:
        type: string
  UserProfile:
    type: object
    properties:
      firstName:
        type: string
      lastName:
        type: string
  TransactionsResponse:
    type: object
    properties:
      status:
        type: integer
        example: 200
      message:
        type: string
        example: "Transactions retrieved successfully"
      body:
        type: array
        items:
          $ref: '#/definitions/Transaction'
  Transaction:
    type: object
    properties:
      transactionId:
        type: string
        example: "tx_001"
      accountId:
        type: string
        example: "8349"
      amount:
        type: number
        format: float
        example: 10.00
      date:
        type: string
        format: date
        example: "2020-06-20"
      description:
        type: string
        example: "Golden Sun Bakery"
      category:
        type: string
        example: "Food"
      note:
        type: string
        example: "Dinner with friends"
  TransactionUpdate:
    type: object
    properties:
      category:
        type: string
        example: "Food"
      note:
        type: string
        example: "Lunch with colleagues"